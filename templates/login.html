<!DOCTYPE html>
<html>

<head>

    <title>AgriConnect - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>🌾 AgriConnect</h1>

    <h2>Farmer Login</h2>

    {% if error %}

        <p class="error">{{ error }}</p>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo">
        Demo Username: farmer<br>
        Demo Password: 1234
    </p>

</div>

</body>

</html>

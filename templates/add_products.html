<!DOCTYPE html>
<html>

<head>

    <title>Add Product - AgriConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>🌾 AgriConnect</h2>

    <div>

        <a href="/home">Home</a>

        <a href="/products">Products</a>

        <a href="/profile">Profile</a>

    </div>

</nav>


<div class="form-container">

    <h1>Sell / Rent Agricultural Product</h1>

    <form method="POST">

        <label>Product Name</label>

        <input
            type="text"
            name="name"
            placeholder="Example: Mahindra 575 DI"
            required
        >


        <label>Category</label>

        <select name="category" required>

            <option value="Tractor">
                Tractor
            </option>

            <option value="Implement">
                Implement
            </option>

            <option value="Fertilizer">
                Fertilizer
            </option>

            <option value="Seed">
                Seed
            </option>

        </select>


        <label>Brand</label>

        <input
            type="text"
            name="brand"
            placeholder="Brand name"
        >


        <label>Price</label>

        <input
            type="number"
            name="price"
            placeholder="Price in rupees"
            required
        >


        <label>Sell or Rent</label>

        <select name="type" required>

            <option value="Buy">
                For Sale
            </option>

            <option value="Rent">
                For Rent
            </option>

        </select>


        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Village / Town"
        >


        <button type="submit">
            Add Product
        </button>

    </form>

</div>

</body>

</html>
